services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: irs-postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - irs-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  irs-postgres-data: